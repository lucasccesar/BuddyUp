name: Sincronizar backlog do BuddyUp
on:
  issues:
    types: [opened, closed, reopened, assigned, labeled, unlabeled]
  pull_request:
    branches: [main]
    types: [opened, reopened, edited, ready_for_review, converted_to_draft, closed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      previa:
        description: Mostrar mudanças sem alterar o quadro
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: buddyup-backlog
  cancel-in-progress: false
jobs:
  sincronizar:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Conferir dependências
        env:
          GH_TOKEN: ${{ secrets.BUDDYUP_PROJECT_TOKEN }}
          APPLY_CHANGES: ${{ github.event_name != 'workflow_dispatch' || !inputs.previa }}
        run: python3 .github/scripts/sincronizar_backlog.py
