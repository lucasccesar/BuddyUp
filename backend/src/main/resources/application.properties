spring.application.name=buddyup-api
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=buddyup
spring.flyway.default-schema=public
buddyup.registration.code-key=${BUDDYUP_REGISTRATION_CODE_KEY:}
buddyup.accounts.web-origin=${BUDDYUP_WEB_ORIGIN:}
buddyup.accounts.password-reset-url=${BUDDYUP_PASSWORD_RESET_URL:}
spring.mail.properties[mail.smtp.connectiontimeout]=3000
spring.mail.properties[mail.smtp.timeout]=3000
spring.mail.properties[mail.smtp.writetimeout]=3000
