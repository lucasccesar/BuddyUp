name: buddyup

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: buddyup
      POSTGRES_USER: buddyup
      POSTGRES_PASSWORD: buddyup
    ports:
      - '127.0.0.1:${BUDDYUP_POSTGRES_PORT:-15432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U buddyup -d buddyup']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
